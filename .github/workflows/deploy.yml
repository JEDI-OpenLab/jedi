name: Déploiement GitHub Pages (Starlight · site)

# Construit le portail (dossier site/, Astro 6 + Starlight) et le publie sur
# GitHub Pages à chaque push sur main. Il suffit de pousser : le reste est automatique.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler une publication en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node 22 (requis par Astro 6)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
